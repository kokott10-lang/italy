plugins { id 'com.android.application' }
android {
    namespace 'com.italia.explorer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.italia.explorer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // 배포용이 아닌 개인 설치용: 디버그 키로 서명해 바로 설치 가능
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
